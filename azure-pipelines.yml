trigger:
  branches:
    include:
      - 9-Block-Negative-Cases
      - 9-Block-Positive-Cases
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

stages:
  - stage: BuildAndValidate
    displayName: 'Build, Lint & Metric Analysis'
    jobs:
      - job: BackendBuild
        displayName: 'Build & Test .NET Core Web API'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(DOTNET_VERSION)

          - script: dotnet restore backend/NineBlock.Api/NineBlock.Api.csproj
            displayName: 'Restore NuGet Packages'

          - script: dotnet build backend/NineBlock.Api/NineBlock.Api.csproj --configuration $(buildConfiguration) --no-restore
            displayName: 'Build Backend Project'

          - script: dotnet publish backend/NineBlock.Api/NineBlock.Api.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend-publish
            displayName: 'Publish Backend Artifact'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend-publish'
              ArtifactName: 'backend-drop'

      - job: FrontendBuild
        displayName: 'Build React Application with Webpack'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              cd frontend
              npm install --legacy-peer-deps
            displayName: 'Install NPM Dependencies'

          - script: |
              cd frontend
              npm run build
            displayName: 'Run Webpack Production Build'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'frontend/dist'
              ArtifactName: 'frontend-drop'

      - job: MetricAnalysis
        displayName: 'White-Box Code Duplication (jscpd)'
        dependsOn:
          - BackendBuild
          - FrontendBuild
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              mkdir -p reports
              npx jscpd backend/NineBlock.Api/Services/ --reporters console,json --output reports/backend-duplication.json || true
              npx jscpd frontend/src/components/ --reporters console,json --output reports/frontend-duplication.json || true
            displayName: 'Scan Duplication Clones (jscpd)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'reports'
              ArtifactName: 'metric-reports'
