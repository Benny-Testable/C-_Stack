tool: jscpd
version: "5.3.2"
language: javascript
language_version: "ES2022"
technique: "Code Quality Auditing"
classification: "Code Duplication Detection"
target_files:
  - NineBoxGrid.jsx
  - CalibrationBoard.jsx
run:
  command: "bash run_jscpd.sh"
thresholds:
  min_lines: 10
  min_tokens: 50
expects:
  - duplicate_clone_detected: true
  - min_duplicated_lines: 30
  - exit_code: 0
