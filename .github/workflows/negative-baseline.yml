# Scholarship CMGroups — negative metric validation baseline
# Branch: Scholarship-CMGroups-negative-1
# The "verify" job PASSES when build/tests pass and the Statement Coverage and
# Lint / Rule Violations gates FAIL exactly as designed.
name: negative-baseline

on:
  push:
    branches: [Scholarship-CMGroups-negative-1]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify negative baseline
        run: bash scripts/verify-negative-baseline.sh
      - name: Upload coverage, lint and log reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negative-baseline-reports
          path: |
            reports/
            frontend/coverage/
