name: CI

on:
  push:
    branches: [positive-build-2]
  pull_request:
    branches: [positive-build-2]
  workflow_dispatch:

jobs:
  build-and-metrics:
    # Service containers need a Linux runner; pwsh (PowerShell 7.4+) runs
    # cross-platform, so this still honors the branch's PowerShell-primary
    # build-shell requirement while giving us a real Postgres to test against.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: westcoastfitness
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (positive-build-2, Configuration A: framework-dependent)
        shell: pwsh
        run: ./scripts/build-positive-build-2.ps1

      - name: Metrics (positive-build-2)
        shell: pwsh
        run: ./scripts/run-positive-build-2-metrics.ps1

      - name: E2E smoke test against real Postgres
        shell: bash
        env:
          ConnectionStrings__FitnessClubDb: "Host=localhost;Port=5432;Database=westcoastfitness;Username=postgres;Password=postgres"
          ASPNETCORE_URLS: "http://+:8080"
        run: |
          dotnet artifacts/positive-build-2/backend/WestCoastFitness.Api.dll &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/api/members
          kill $APP_PID

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positive-build-2-artifacts
          path: artifacts/positive-build-2/
