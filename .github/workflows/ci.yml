name: 9-Block CI/CD Pipeline

on:
  push:
    branches:
      - 9-Block-Negative-Cases
      - 9-Block-Positive-Cases
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    name: Backend CI (.NET 9.0)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/NineBlock.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/NineBlock.csproj --configuration Release --no-restore

  frontend-build:
    name: Frontend CI (React + Webpack)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Compile Webpack Production Bundle
        working-directory: frontend
        run: npm run build

  white-box-metrics:
    name: White-Box Metrics (jscpd Clone Scan)
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan Backend Code Duplication
        run: npx jscpd backend/NineBlock.Api/Services/ || true

      - name: Scan Frontend Code Duplication
        run: npx jscpd frontend/src/components/ || true
