tool: jscpd
version: "5.3.2"
language: csharp
language_version: "9.0"
technique: "Code Quality Auditing"
classification: "Code Duplication Detection"
target_files:
  - NineBoxMatrixService.cs
  - EmployeeEvaluationService.cs
run:
  command: "bash run_jscpd.sh"
thresholds:
  min_lines: 10
  min_tokens: 50
expects:
  - duplicate_clone_detected: true
  - min_duplicated_lines: 40
  - exit_code: 0
