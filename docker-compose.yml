services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: westcoastfitness
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d westcoastfitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=westcoastfitness;Username=fitness;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: west-coast-fitness
      Jwt__Audience: west-coast-fitness-members
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
